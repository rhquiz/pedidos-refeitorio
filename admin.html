<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYLOR • Painel Industrial</title><style>:root{--green:#28563b;--cream:#f6f1e7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#163c2a;font:16px Arial}header{background:#fff;padding:20px 4%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px}main{max-width:1180px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:20px;padding:25px;margin-bottom:20px;box-shadow:0 7px 22px #193b2510}input,select,button{font:inherit;padding:12px;border:1px solid #d3dccf;border-radius:10px;max-width:100%}button{background:var(--green);color:#fff;cursor:pointer}button.secondary{background:#e2eadc;color:#163c2a}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.row label{display:grid;gap:6px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav button.active{background:#163c2a}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border-bottom:1px solid #dce5d7;padding:12px;text-align:left}th{background:#e2eadc}.scroll{overflow:auto}.error{color:#a02816}.note{color:#53665b}#app{display:none}@media print{header,nav,.noprint,button,input,select{display:none!important}body{background:white}.card{box-shadow:none}#app{display:block!important}}</style></head><body><header><h1>🌱 VYLOR | Painel da Industrial</h1><button id="logout" style="display:none" onclick="logout()">Sair</button></header><main><section id="login" class="card"><h2>Acesso restrito</h2><p>Entre com seu e-mail e senha autorizados.</p><form onsubmit="login(event)" class="row"><label>E-mail<input id="email" type="email" required autocomplete="username"></label><label>Senha<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form><p id="loginMsg" class="error"></p></section><section id="app"><nav class="noprint"><button onclick="tab('orders')">Pedidos</button><button onclick="tab('people')">Colaboradores</button><button onclick="tab('specials')">Especiais</button><button onclick="tab('users')">Acessos</button></nav><div id="content" class="card"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://qhggqfybvtqwfjqotwzk.supabase.co','sb_publishable_9V3Xa93f59OCO0IMFOw5mw_vAm0OmEX');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let role='',active='orders',orders=[];const date=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function msg(t){$('#msg').textContent=t}async function login(e){e.preventDefault();$('#loginMsg').textContent='Entrando...';const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#loginMsg').textContent='E-mail ou senha inválidos.';return}await init()}async function init(){const {data:{user}}=await db.auth.getUser();if(!user)return;const {data,error}=await db.from('admin_users').select('role').eq('user_id',user.id).maybeSingle();if(error||!data){$('#loginMsg').textContent='Seu usuário não tem permissão administrativa.';await db.auth.signOut();return}role=data.role;$('#login').style.display='none';$('#app').style.display='block';$('#logout').style.display='';tab('orders')}async function logout(){await db.auth.signOut();location.reload()}function tab(t){active=t;if(t==='orders')renderOrders();if(t==='people')renderPeople();if(t==='specials')renderSpecials();if(t==='users')renderUsers()}async function renderOrders(){const d=window.filterDay||date();$('#content').innerHTML=`<h2>Pedidos e retiradas</h2><div class="row noprint"><label>Data da refeição<input type="date" id="day" value="${d}"></label><label>Turno<select id="shift"><option value="">Todos</option><option>1º Turno</option><option>2º Turno</option><option>3º Turno</option><option>Administrativo</option></select></label><button onclick="loadOrders()">Filtrar</button><button onclick="window.print()">🖨 Imprimir lista</button><button onclick="exportCSV()">Exportar CSV</button></div><p id="msg"></p><div id="list" class="scroll"></div>`;loadOrders()}async function loadOrders(){const d=$('#day').value,shift=$('#shift').value;window.filterDay=d;let q=db.from('orders').select('id,meal_date,kind,detail,delivered,collaborators(name,badge,shift,sector)').eq('meal_date',d).order('created_at',{ascending:true});const {data,error}=await q;if(error)return msg('Falha ao consultar pedidos.');orders=(data||[]).filter(x=>!shift||x.collaborators?.shift===shift);$('#list').innerHTML=`<p><b>${orders.length} pedidos</b></p><table><thead><tr><th>Retirou?</th><th>Nome</th><th>Crachá</th><th>Turno</th><th>Refeição</th></tr></thead><tbody>${orders.map(o=>`<tr><td><input type="checkbox" ${o.delivered?'checked':''} onchange="delivery('${o.id}',this.checked)"></td><td>${esc(o.collaborators?.name)}</td><td>${esc(o.collaborators?.badge)}</td><td>${esc(o.collaborators?.shift)}</td><td>${esc(o.kind==='OMELETE'?o.detail:'ESPECIAL: '+o.detail)}</td></tr>`).join('')}</tbody></table>`}async function delivery(id,v){const {error}=await db.from('orders').update({delivered:v}).eq('id',id);if(error){alert('Não foi possível atualizar a entrega.');loadOrders()}}function exportCSV(){const rows=[['Nome','Crachá','Setor','Turno','Data','Tipo','Descrição','Retirou'],...orders.map(o=>[o.collaborators?.name,o.collaborators?.badge,o.collaborators?.sector,o.collaborators?.shift,o.meal_date,o.kind,o.detail,o.delivered?'Sim':'Não'])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pedidos-'+window.filterDay+'.csv';a.click();URL.revokeObjectURL(a.href)}function renderPeople(){$('#content').innerHTML=`<h2>Colaboradores</h2><p class="note">Importe um CSV com colunas: cracha,nome,setor,turno. Use a exportação CSV do Excel.</p><div class="row noprint"><label>Crachá<input id="badge"></label><label>Nome<input id="name"></label><label>Setor<input id="sector"></label><label>Turno<select id="shift"><option>1º Turno</option><option>2º Turno</option><option>3º Turno</option><option>Administrativo</option></select></label><button onclick="addPerson()">Cadastrar</button></div><p><input class="noprint" type="file" id="file" accept=".csv,text/csv"><button class="noprint" onclick="importPeople()">Importar CSV</button></p><p id="msg"></p><div id="list" class="scroll"></div>`;listPeople()}async function listPeople(){const {data,error}=await db.from('collaborators').select('badge,name,sector,shift').order('name').limit(500);if(error)return msg('Falha ao listar colaboradores.');$('#list').innerHTML=`<p>${data.length} colaboradores exibidos</p><table><tr><th>Crachá</th><th>Nome</th><th>Setor</th><th>Turno</th></tr>${data.map(p=>`<tr><td>${esc(p.badge)}</td><td>${esc(p.name)}</td><td>${esc(p.sector)}</td><td>${esc(p.shift)}</td></tr>`).join('')}</table>`}async function addPerson(){const x={badge:$('#badge').value.trim(),name:$('#name').value.trim(),sector:$('#sector').value.trim(),shift:$('#shift').value};if(!x.badge||!x.name||!x.sector)return msg('Preencha os campos.');const {error}=await db.from('collaborators').upsert(x,{onConflict:'badge'});msg(error?'Erro ao cadastrar.':'Cadastro salvo.');if(!error)listPeople()}function parseCSV(s){const lines=s.replace(/^\ufeff/,'').trim().split(/\r?\n/);const sep=lines[0].includes(';')?';':',';const parse=line=>{let a=[],v='',quoted=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){a.push(v);v=''}else v+=c}a.push(v);return a};const keys=parse(lines.shift()).map(x=>x.trim().toLowerCase());return lines.filter(Boolean).map(line=>Object.fromEntries(parse(line).map((v,i)=>[keys[i],v.trim()])))}async function importPeople(){const f=$('#file').files[0];if(!f)return msg('Selecione o CSV.');let rows=parseCSV(await f.text()).map(p=>({badge:p.cracha||p.badge,name:p.nome||p.name,sector:p.setor||p.sector,shift:p.turno||p.shift}));if(rows.some(p=>!p.badge||!p.name||!p.sector||!p.shift))return msg('CSV com colunas ausentes ou linhas incompletas.');let ok=0;for(let i=0;i<rows.length;i+=100){const {error}=await db.from('collaborators').upsert(rows.slice(i,i+100),{onConflict:'badge'});if(error)return msg(`Importação interrompida após ${ok} registros. Confira os dados.`);ok+=Math.min(100,rows.length-i)}msg(`${ok} colaboradores importados.`);listPeople()}function renderSpecials(){$('#content').innerHTML=`<h2>Especial do dia</h2><div class="row"><label>Data<input type="date" id="date" value="${date()}"></label><label>Descrição do especial<input id="description" placeholder="Ex.: Lasanha à bolonhesa" style="min-width:320px"></label><button onclick="saveSpecial()">Salvar especial</button></div><p id="msg"></p><div id="list"></div>`;listSpecials()}async function saveSpecial(){const {error}=await db.from('specials').upsert({meal_date:$('#date').value,description:$('#description').value.trim()},{onConflict:'meal_date'});msg(error?'Não foi possível salvar.':'Especial salvo.');if(!error)listSpecials()}async function listSpecials(){const {data,error}=await db.from('specials').select('*').order('meal_date',{ascending:false}).limit(40);if(error)return msg('Falha ao consultar especiais.');$('#list').innerHTML=`<table><tr><th>Data</th><th>Especial</th></tr>${data.map(x=>`<tr><td>${esc(x.meal_date)}</td><td>${esc(x.description)}</td></tr>`).join('')}</table>`}function renderUsers(){$('#content').innerHTML=`<h2>Permissões</h2><p>Seu perfil: <b>${esc(role)}</b></p><p>Para liberar novos acessos, crie o usuário em <b>Supabase → Authentication → Users</b> e depois cadastre o ID dele na tabela <b>admin_users</b> usando o SQL Editor. Somente o administrador principal deve fazer isso.</p>`}db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('#app').style.display='none';$('#login').style.display='block'}});init();
</script></body></html>

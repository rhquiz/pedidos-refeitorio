<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYLOR | Administração do Refeitório</title>
<style>
:root{--forest:#23563e;--deep:#153b2d;--wine:#893e4a;--cream:#f7f3e9;--line:#dce4d9;--muted:#66776c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--deep);font:15px system-ui,-apple-system,'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--forest);color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:750}button:hover{filter:brightness(.94)}button:disabled{opacity:.5;cursor:not-allowed}.ghost{background:#e4eddf;color:var(--deep)}.danger{background:#923e48}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}aside{background:var(--deep);color:#fff;padding:26px 16px}.brand{font-size:27px;font-weight:900;letter-spacing:1px;padding:0 12px}.subbrand{font-size:12px;color:#bed6c6;padding:0 12px 24px}.nav{display:grid;gap:8px}.nav button{background:transparent;text-align:left;width:100%;font-weight:650}.nav button.selected,.nav button:hover{background:#31664d}.workspace{min-width:0}header{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px}header h1{margin:0;font-size:24px;color:var(--wine)}main{padding:25px;max-width:1500px;margin:auto}.panel{background:white;border:1px solid #e8e7df;border-radius:20px;padding:23px;margin-bottom:18px;box-shadow:0 8px 24px #163a2510}h2{margin:0 0 18px;color:var(--wine)}h3{margin:0 0 12px}.muted{color:var(--muted)}.flex{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;min-width:160px;flex:1}.field.wide{flex:2;min-width:250px}label{font-weight:650}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd9cb;border-radius:11px;background:#fff;color:var(--deep)}textarea{min-height:90px;resize:vertical}.cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:14px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);padding:22px;border-radius:18px}.metric strong{display:block;font-size:32px;color:var(--wine)}.metric span{color:var(--muted)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7ece6;vertical-align:middle}th{background:#e9f0e5;font-size:13px}td{font-size:14px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f0e5;font-size:12px;font-weight:700}.tag.red{background:#fae7e8;color:#8d3340}.message{min-height:20px;margin-top:14px;font-weight:650}.message.bad{color:#b12f3c}.message.good{color:#26754b}#login{max-width:480px;margin:9vh auto;padding:35px}#login h1{font-size:32px;color:var(--wine)}#app{display:none}#logout{display:none}#mobileHead{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:8px 11px;font-size:13px}.inline-check{display:flex;gap:7px;align-items:center}.inline-check input{width:auto}.login-shell{padding:20px}.footnote{font-size:13px;color:var(--muted);margin-top:12px}@media(max-width:850px){.shell{display:block}aside{padding:14px}.brand,.subbrand{display:inline;padding:0 12px}.nav{display:flex;overflow-x:auto;margin-top:12px}.nav button{white-space:nowrap;width:auto}header{padding:15px}main{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:16px}}@media print{aside,header,.noprint,.actions,button,form{display:none!important}.shell{display:block}main{padding:0}.panel{box-shadow:none;border:0;padding:0}body{background:#fff}table{min-width:0}th,td{padding:7px;font-size:11px}}
</style></head><body>
<section class="login-shell" id="login"><div class="panel" style="max-width:470px;margin:8vh auto"><h1>VYLOR</h1><h2>Painel da Industrial</h2><p class="muted">Entre com seu e-mail e senha do Supabase. O acesso por telefone será configurado depois.</p><form id="loginForm"><div class="field"><label>E-mail</label><input type="email" id="email" autocomplete="username" required></div><br><div class="field"><label>Senha</label><input type="password" id="password" autocomplete="current-password" required></div><br><button type="submit" id="loginBtn" style="width:100%">ENTRAR NO PAINEL →</button></form><p id="loginMsg" class="message" role="status"></p></div></section>
<div class="shell" id="app"><aside><div class="brand">🌿 VYLOR</div><div class="subbrand">GESTÃO DO REFEITÓRIO</div><nav class="nav" id="nav"><button data-tab="dashboard">▦ Visão geral</button><button data-tab="cardapios">▣ Cardápios</button><button data-tab="pedidos">☷ Pedidos e entregas</button><button data-tab="colaboradores">♙ Colaboradores</button><button data-tab="acessos">♙ Acessos</button></nav></aside><div class="workspace"><header><div><h1 id="pageTitle">Visão geral</h1><div class="muted" id="who"></div></div><button id="logout" class="ghost noprint">Sair</button></header><main id="content"></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const db=supabase.createClient('https://qhggqfybvtqwfjqotwzk.supabase.co','sb_publishable_9V3Xa93f59OCO0IMFOw5mw_vAm0OmEX');
const $=s=>document.querySelector(s), safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dayPlus=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let role='',currentUser=null,activeTab='dashboard',currentOrders=[],allPeople=[],currentDay=dayPlus(1);
function notice(t,bad=false){const el=$('#notice');if(el){el.textContent=t;el.className='message '+(bad?'bad':'good')}}
function fail(e){return e?.message||'Erro desconhecido'}
function showLogin(t=''){ $('#login').style.display='block';$('#app').style.display='none';$('#logout').style.display='none';$('#loginMsg').textContent=t }
async function init(){const {data:{user},error}=await db.auth.getUser();if(error||!user){showLogin();return}const q=await db.from('admin_users').select('role,ativo,nome').eq('user_id',user.id).maybeSingle();if(q.error||!q.data||q.data.ativo!==true||!['ADMIN_PRINCIPAL','OPERADOR'].includes(q.data.role)){await db.auth.signOut();showLogin('Seu usuário não está autorizado ou está inativo.');return}role=q.data.role;currentUser=user;$('#login').style.display='none';$('#app').style.display='grid';$('#logout').style.display='block';$('#who').textContent=`${q.data.nome||user.email||'Usuário'} • ${role==='ADMIN_PRINCIPAL'?'Administradora principal':'Industrial'}`;await go('cardapios')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginBtn').disabled=true;$('#loginMsg').textContent='Verificando acesso...';const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;if(error){$('#loginMsg').textContent='E-mail ou senha inválidos.';return}await init()});
$('#logout').addEventListener('click',async()=>{await db.auth.signOut();showLogin()});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
async function go(t){activeTab=t;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.tab===t));$('#pageTitle').textContent=({dashboard:'Visão geral',cardapios:'Cardápios',pedidos:'Pedidos e entregas',colaboradores:'Colaboradores',acessos:'Acessos'})[t];if(t==='dashboard')await dashboard();if(t==='cardapios')await cardapios();if(t==='pedidos')await pedidos();if(t==='colaboradores')await colaboradores();if(t==='acessos')await acessos()}
async function cardapios(){const fri=new Date().getDay()===5;$('#content').innerHTML=`<section class="panel"><h2>🍽️ Cadastrar especial</h2><p class="muted">O prato salvo aqui aparece automaticamente no aplicativo dos colaboradores na data selecionada.</p><form id="menuForm"><div class="flex"><div class="field"><label>Data da refeição</label><input type="date" id="menuDate" required value="${fri?dayPlus(1):dayPlus(1)}"></div><div class="field wide"><label>Nome do prato</label><input id="menuName" maxlength="160" placeholder="Ex.: Frango grelhado" required></div></div><br><div class="field"><label>Descrição que aparecerá em destaque</label><textarea id="menuDescription" maxlength="700" placeholder="Ex.: Frango grelhado com arroz, feijão e salada" required></textarea></div><br><div class="actions"><button type="submit">SALVAR CARDÁPIO ✓</button><button type="button" class="ghost" id="loadMenu">Carregar cardápio da data</button></div></form><p id="notice" class="message" role="status"></p></section><section class="panel"><h2>Próximos cardápios</h2><div id="menusTable" class="tablewrap">Carregando...</div></section>`;$('#menuForm').addEventListener('submit',saveMenu);$('#loadMenu').addEventListener('click',loadMenuForDate);$('#menuDate').addEventListener('change',loadMenuForDate);await listMenus();await loadMenuForDate()}
async function loadMenuForDate(){const d=$('#menuDate').value;if(!d)return;const {data,error}=await db.from('cardapios').select('especial,descricao_especial').eq('data_refeicao',d).maybeSingle();if(error){notice('Erro ao buscar cardápio: '+fail(error),true);return}$('#menuName').value=data?.especial||'';$('#menuDescription').value=data?.descricao_especial||'';if(data)notice('Cardápio existente carregado. Você pode editá-lo e salvar.');else notice('Nenhum especial cadastrado para esta data.')}
async function saveMenu(e){e.preventDefault();const data_refeicao=$('#menuDate').value,especial=$('#menuName').value.trim(),descricao_especial=$('#menuDescription').value.trim();if(!data_refeicao||!especial||!descricao_especial){notice('Preencha todos os campos.',true);return}const btn=e.submitter;btn.disabled=true;const {error}=await db.from('cardapios').upsert({data_refeicao,especial,descricao_especial},{onConflict:'data_refeicao'});btn.disabled=false;if(error){notice('Não foi possível salvar: '+fail(error),true);return}notice('Cardápio salvo! Ele já pode ser consultado pelo aplicativo.');await listMenus()}
async function listMenus(){const {data,error}=await db.from('cardapios').select('data_refeicao,especial,descricao_especial').gte('data_refeicao',dayPlus(-7)).order('data_refeicao',{ascending:true}).limit(90);if(error){$('#menusTable').textContent='Falha: '+fail(error);return}$('#menusTable').innerHTML=`<table><thead><tr><th>Data</th><th>Especial</th><th>Descrição</th><th class="noprint">Ação</th></tr></thead><tbody>${(data||[]).map(m=>`<tr><td>${safe(m.data_refeicao)}</td><td>${safe(m.especial)}</td><td>${safe(m.descricao_especial)}</td><td class="noprint"><button class="small ghost" data-edit="${safe(m.data_refeicao)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum cardápio encontrado.</td></tr>'}</tbody></table>`;$('#menusTable').querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{$('#menuDate').value=b.dataset.edit;loadMenuForDate();window.scrollTo({top:0,behavior:'smooth'})}))}
async function fetchOrders(d){const p=await db.from('pedidos').select('*').eq('data_refeicao',d).order('created_at',{ascending:true});if(p.error)throw p.error;const rows=p.data||[];const ids=[...new Set(rows.map(o=>o.colaborador_id).filter(Boolean))];const persons=ids.length?await db.from('colaboradores').select('id,nome,cracha,setor,turno').in('id',ids):{data:[]};if(persons.error)throw persons.error;const personMap=new Map((persons.data||[]).map(x=>[x.id,x]));const flavorIds=[...new Set(rows.map(o=>o.sabor_omelete_id).filter(Boolean))];const flavors=flavorIds.length?await db.from('sabores_omelete').select('*').in('id',flavorIds):{data:[]};const flavMap=new Map((flavors.data||[]).map(x=>[x.id,x]));const ent=rows.length?await db.from('entregas').select('pedido_id,entregue_em').in('pedido_id',rows.map(x=>x.id)):{data:[]};if(ent.error)throw ent.error;const entregas=new Map((ent.data||[]).map(x=>[x.pedido_id,x]));return rows.map(o=>({...o,pessoa:personMap.get(o.colaborador_id)||{},sabor:flavMap.get(o.sabor_omelete_id)||{},entrega:entregas.get(o.id)||null}))}
function description(o){if(o.tipo==='ESPECIAL')return o.descricao_especial||'Especial';return o.sabor.nome||o.sabor.descricao||o.sabor.sabor||'Omelete'}
async function dashboard(){const d=currentDay;$('#content').innerHTML=`<section class="panel noprint"><div class="flex"><div class="field"><label>Data da refeição</label><input type="date" id="dashDay" value="${safe(d)}"></div><button id="dashRefresh">Atualizar</button></div><p id="notice" class="message"></p></section><div id="stats" class="cards"></div><section class="panel"><h2>Resumo das refeições</h2><div id="dashList"></div></section>`;$('#dashRefresh').onclick=()=>{currentDay=$('#dashDay').value;dashboard()};try{const a=await fetchOrders(d);const active=a.filter(x=>x.status!=='CANCELADO');const counts=[['Pedidos',active.length],['Especiais',active.filter(x=>x.tipo==='ESPECIAL').length],['Omeletes',active.filter(x=>x.tipo==='OMELETE').length],['Entregues',active.filter(x=>x.entrega).length]];$('#stats').innerHTML=counts.map(([k,v])=>`<div class="metric"><strong>${v}</strong><span>${k}</span></div>`).join('');const byShift={};for(const x of active){const t=x.pessoa.turno||'Não informado';byShift[t]=(byShift[t]||0)+1}$('#dashList').innerHTML=Object.keys(byShift).length?Object.entries(byShift).map(([k,v])=>`<p><span class="tag">${safe(k)}</span> ${v} pedido(s)</p>`).join(''):'Nenhum pedido para a data selecionada.'}catch(e){notice('Falha ao carregar resumo: '+fail(e),true)}}
async function pedidos(){$('#content').innerHTML=`<section class="panel"><h2>Pedidos e retiradas</h2><div class="flex noprint"><div class="field"><label>Data da refeição</label><input type="date" id="orderDay" value="${safe(currentDay)}"></div><div class="field"><label>Pesquisar</label><input id="searchOrder" placeholder="Nome ou crachá"></div><div class="field"><label>Turno</label><select id="shiftFilter"><option value="">Todos</option></select></div><div class="field"><label>Tipo</label><select id="typeFilter"><option value="">Todos</option><option>ESPECIAL</option><option>OMELETE</option></select></div><button id="refreshOrders">Buscar</button><button id="printOrders" class="ghost">Imprimir</button><button id="csvOrders" class="ghost">Exportar CSV</button></div><p id="notice" class="message"></p><div id="ordersTable" class="tablewrap"></div></section>`;$('#refreshOrders').onclick=loadOrders;$('#printOrders').onclick=()=>window.print();$('#csvOrders').onclick=exportOrders;$('#searchOrder').oninput=renderOrderTable;$('#typeFilter').onchange=renderOrderTable;$('#shiftFilter').onchange=renderOrderTable;await loadOrders()}
async function loadOrders(){currentDay=$('#orderDay').value;notice('Carregando pedidos...');try{currentOrders=await fetchOrders(currentDay);const shifts=[...new Set(currentOrders.map(x=>x.pessoa.turno).filter(Boolean))].sort();$('#shiftFilter').innerHTML='<option value="">Todos</option>'+shifts.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join('');notice('Pedidos carregados.');renderOrderTable()}catch(e){notice('Falha ao consultar pedidos: '+fail(e),true)}}
function filteredOrders(){const q=($('#searchOrder')?.value||'').toLocaleLowerCase('pt-BR'),shift=$('#shiftFilter')?.value||'',tipo=$('#typeFilter')?.value||'';return currentOrders.filter(o=>(!q||`${o.pessoa.nome||''} ${o.pessoa.cracha||''}`.toLocaleLowerCase('pt-BR').includes(q))&&(!shift||o.pessoa.turno===shift)&&(!tipo||o.tipo===tipo))}
function renderOrderTable(){const a=filteredOrders();$('#ordersTable').innerHTML=`<p><strong>${a.length}</strong> pedido(s) encontrados</p><table><thead><tr><th>Retirada</th><th>Nome</th><th>Crachá</th><th>Setor</th><th>Turno</th><th>Tipo</th><th>Refeição</th><th>Status</th></tr></thead><tbody>${a.map(o=>`<tr><td>${o.status==='CANCELADO'?'<span class="tag red">Cancelado</span>':`<label class="inline-check noprint"><input type="checkbox" data-delivery="${safe(o.id)}" ${o.entrega?'checked':''}> ${o.entrega?'Entregue':'Pendente'}</label><span class="printonly" style="display:none">${o.entrega?'Sim':'Não'}</span>`}</td><td>${safe(o.pessoa.nome)}</td><td>${safe(o.pessoa.cracha)}</td><td>${safe(o.pessoa.setor)}</td><td>${safe(o.pessoa.turno)}</td><td>${safe(o.tipo)}</td><td>${safe(description(o))}</td><td><span class="tag ${o.status==='CANCELADO'?'red':''}">${safe(o.status)}</span></td></tr>`).join('')||'<tr><td colspan="8">Nenhum pedido encontrado.</td></tr>'}</tbody></table>`;$('#ordersTable').querySelectorAll('[data-delivery]').forEach(c=>c.addEventListener('change',()=>toggleDelivery(c.dataset.delivery,c.checked)))}
async function toggleDelivery(id,checked){const row=currentOrders.find(x=>x.id===id);if(!row)return;let error;if(checked){({error}=await db.from('entregas').insert({pedido_id:id,entregue_por:currentUser.id}))}else{({error}=await db.from('entregas').delete().eq('pedido_id',id))}if(error){alert('Não foi possível alterar a entrega: '+fail(error));await loadOrders();return}row.entrega=checked?{pedido_id:id,entregue_em:new Date().toISOString()}:null;renderOrderTable()}
function csvDownload(name,rows){const s='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportOrders(){csvDownload(`pedidos-${currentDay}.csv`,[['Nome','Cracha','Setor','Turno','Data','Tipo','Refeicao','Status','Entregue'],...filteredOrders().map(o=>[o.pessoa.nome,o.pessoa.cracha,o.pessoa.setor,o.pessoa.turno,o.data_refeicao,o.tipo,description(o),o.status,o.entrega?'Sim':'Não'])])}
async function colaboradores(){if(role!=='ADMIN_PRINCIPAL'){$('#content').innerHTML='<section class="panel"><h2>Colaboradores</h2><p>Somente a administradora principal pode consultar e alterar cadastros nesta versão.</p></section>';return}$('#content').innerHTML=`<section class="panel"><h2>Colaboradores</h2><form id="personForm"><div class="flex"><div class="field"><label>Crachá (com zeros)</label><input id="personBadge" required></div><div class="field wide"><label>Nome</label><input id="personName" required></div><div class="field"><label>Setor</label><input id="personSector" required></div><div class="field"><label>Turno</label><input id="personShift" required placeholder="Ex.: 1º Turno"></div><button>Salvar</button></div></form><p class="footnote">Cadastro manual. Para importar centenas de pessoas, vamos validar o modelo CSV antes de ativar a importação.</p><p id="notice" class="message"></p><div class="flex noprint"><div class="field"><label>Pesquisar colaborador</label><input id="personSearch" placeholder="Nome ou crachá"></div><button id="personRefresh">Atualizar</button></div><div id="peopleTable" class="tablewrap"></div></section>`;$('#personForm').onsubmit=savePerson;$('#personSearch').oninput=renderPeople;$('#personRefresh').onclick=loadPeople;await loadPeople()}
async function loadPeople(){const {data,error}=await db.from('colaboradores').select('id,cracha,nome,setor,turno,ativo').order('nome').limit(1000);if(error){notice('Falha ao listar: '+fail(error),true);return}allPeople=data||[];renderPeople()}
function renderPeople(){const q=($('#personSearch')?.value||'').toLocaleLowerCase('pt-BR');const a=allPeople.filter(p=>`${p.nome} ${p.cracha}`.toLocaleLowerCase('pt-BR').includes(q));$('#peopleTable').innerHTML=`<p>${a.length} colaborador(es) exibido(s)</p><table><thead><tr><th>Crachá</th><th>Nome</th><th>Setor</th><th>Turno</th><th>Ativo</th></tr></thead><tbody>${a.map(p=>`<tr><td>${safe(p.cracha)}</td><td>${safe(p.nome)}</td><td>${safe(p.setor)}</td><td>${safe(p.turno)}</td><td>${p.ativo?'Sim':'Não'}</td></tr>`).join('')}</tbody></table>`}
async function savePerson(e){e.preventDefault();const cracha=$('#personBadge').value.trim(),nome=$('#personName').value.trim(),setor=$('#personSector').value.trim(),turno=$('#personShift').value.trim();if(!cracha||!nome||!setor||!turno)return;const {error}=await db.from('colaboradores').upsert({cracha,nome,setor,turno,ativo:true,origem_cadastro:'ADMIN'},{onConflict:'cracha'});if(error){notice('Erro: '+fail(error),true);return}notice('Colaborador salvo.');$('#personForm').reset();await loadPeople()}
async function acessos(){if(role!=='ADMIN_PRINCIPAL'){$('#content').innerHTML='<section class="panel"><h2>Acessos</h2><p>Somente a administradora principal gerencia usuários.</p></section>';return}$('#content').innerHTML=`<section class="panel"><h2>Controle de acessos</h2><p>Você é a administradora principal. As duas pessoas da Industrial terão perfil <strong>OPERADOR</strong>.</p><p>Para criar novos usuários, utilize <strong>Supabase → Authentication → Users</strong>. Depois, vincule o UID de cada um na tabela <code>admin_users</code> com o papel <code>OPERADOR</code>.</p><p class="muted">O login por telefone + senha depende de configurar a autenticação por telefone no Supabase. Por enquanto, use e-mail + senha.</p><div id="accessTable"></div></section>`;const {data,error}=await db.from('admin_users').select('nome,role,ativo').order('nome');$('#accessTable').innerHTML=error?'Não foi possível consultar os usuários.':`<table><tr><th>Nome</th><th>Perfil</th><th>Ativo</th></tr>${(data||[]).map(x=>`<tr><td>${safe(x.nome)}</td><td>${safe(x.role)}</td><td>${x.ativo?'Sim':'Não'}</td></tr>`).join('')}</table>`}
init();
</script></body></html>

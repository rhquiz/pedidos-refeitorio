<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refeitório VYLOR | Totem</title>
<style>
:root{--bg:#faf5e9;--cream:#fffdf7;--sage:#dfe9d2;--green:#315f42;--deep:#173c2d;--gold:#e5c77f;--text:#26372c;--muted:#657366;--line:#e4e5d8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef2e3,var(--bg) 35%,#f6f0dd);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.shell{min-height:100dvh;max-width:1180px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;color:var(--deep);font-size:clamp(24px,4vw,38px);font-weight:900;letter-spacing:.05em}.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.19em}.leaf{font-size:36px}.top .right{display:flex;gap:10px}.subtle{background:#fff9;border:1px solid var(--line);color:var(--green);padding:12px 18px;border-radius:16px}.main{flex:1;display:grid;place-items:center;padding:22px 0}.panel{width:min(100%,940px);background:#fff9;border:1px solid #e5e9da;border-radius:32px;box-shadow:0 18px 50px #36553b12;padding:clamp(22px,4vw,50px)}.center{text-align:center}.hero h1{font-size:clamp(46px,9vw,90px);line-height:1.02;color:var(--deep);margin:10px 0}.hero h1 span{color:#648b55}.hero p{font-size:clamp(18px,2.4vw,25px);color:var(--muted)}.food{font-size:clamp(90px,15vw,175px);line-height:1.2;margin:12px 0 24px;filter:drop-shadow(0 12px 8px #294a2318)}.primary{background:var(--green);color:white;border:0;border-radius:22px;min-height:72px;padding:16px 30px;font-size:clamp(19px,2.6vw,28px);font-weight:800;box-shadow:0 9px 18px #315f4226}.primary:hover{background:var(--deep)}.wide{width:100%}.secondary{background:var(--sage);color:var(--deep);border:0;border-radius:18px;padding:17px 22px;font-weight:750;min-height:58px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{background:var(--cream);border:3px solid var(--line);border-radius:24px;padding:22px;min-height:235px;text-align:center}.choice.selected{border-color:var(--green);background:#eef5e9}.choice .pic{height:150px;display:grid;place-items:center}.choice .pic svg{width:min(100%,235px);height:145px}.food{height:200px;display:grid;place-items:center}.food svg{height:100%;max-width:100%}.badge-art svg{width:220px;max-width:100%;height:175px}#cameraVideo{width:100%;max-height:320px;object-fit:cover;border:5px solid var(--green);border-radius:20px;margin-top:14px}#cameraArea{margin:15px 0}.choice .pic{font-size:clamp(65px,9vw,110px)}.choice h3{font-size:26px;margin:12px 0}.choice p{color:var(--muted)}h2{font-size:clamp(27px,4vw,42px);color:var(--deep);margin:0 0 14px}.hint{color:var(--muted);font-size:18px}.field{display:grid;gap:7px;margin:15px 0;text-align:left}.field label{font-weight:750}.field input,.field select{width:100%;padding:18px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:21px;color:var(--text)}.field input:focus,.field select:focus{outline:3px solid #b6d0ae}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions>*{flex:1}.status{padding:14px;border-radius:14px;background:#e9f1e5;margin:16px 0}.error{background:#fff0e6;color:#853b1c}.pill{display:inline-block;background:var(--sage);padding:9px 14px;border-radius:100px;color:var(--deep);font-weight:750}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.opt{padding:18px;border:2px solid var(--line);border-radius:16px;background:#fff;text-align:left;font-weight:700}.opt.selected{border-color:var(--green);background:#eaf3e4}.mini{font-size:14px;color:var(--muted)}.admin{width:min(100%,1100px)}.adminnav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.adminnav button{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.adminnav button.active{background:var(--green);color:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{background:var(--sage)}.notice{border-left:5px solid #b98429;padding:12px 16px;background:#fff4d7;margin:16px 0;border-radius:8px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}@media(max-width:620px){.shell{padding:13px}.panel{border-radius:22px;padding:20px}.grid{grid-template-columns:1fr}.choice{min-height:165px}.choice .pic{font-size:66px}.options{grid-template-columns:1fr}.top .right button{font-size:12px;padding:9px}.actions{flex-direction:column}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="leaf">🌿</span><div>VYLOR<small>CULTIVANDO O FUTURO</small></div></div><div class="right"><button class="subtle" onclick="goHome()">⌂ Início</button></div></header><main class="main" id="app"></main><footer class="footer">Refeitório VYLOR · Versão de apresentação · Pedidos não são gravados no banco</footer></div>
<script>
'use strict';
// IMPORTANTE: demonstração local. NÃO grava nem consulta dados reais no Supabase.
// Antes da produção, implementar autenticação, RLS e funções seguras no servidor.
const app=document.getElementById('app');
const art={
  prato:`<svg viewBox="0 0 280 180" aria-hidden="true"><ellipse cx="140" cy="104" rx="120" ry="64" fill="#d9e8d4"/><ellipse cx="140" cy="98" rx="103" ry="52" fill="#fffdf5" stroke="#90a989" stroke-width="6"/><path d="M75 103Q103 38 174 65Q215 81 205 117Q178 155 113 135Z" fill="#f2cb63" stroke="#d8a44a" stroke-width="5"/><path d="M98 99Q137 62 181 96" stroke="#fbe69a" stroke-width="11" fill="none" stroke-linecap="round"/><g fill="#4c8c52"><ellipse cx="122" cy="95" rx="8" ry="4"/><ellipse cx="169" cy="116" rx="8" ry="4"/><ellipse cx="145" cy="128" rx="7" ry="4"/></g></svg>`,
  especial:`<svg viewBox="0 0 280 180" aria-hidden="true"><ellipse cx="140" cy="148" rx="118" ry="14" fill="#c8d7c2"/><path d="M52 131C56 64 94 34 140 34S224 64 228 131Z" fill="#6d9c75" stroke="#315f42" stroke-width="7"/><path d="M140 35V23" stroke="#315f42" stroke-width="7"/><circle cx="140" cy="21" r="10" fill="#d7b56c"/><path d="M37 136H243" stroke="#315f42" stroke-width="12" stroke-linecap="round"/><path d="M82 102Q105 65 126 68" fill="none" stroke="#c8e1b9" stroke-width="9" stroke-linecap="round"/></svg>`,
  cracha:`<svg viewBox="0 0 240 180" aria-hidden="true"><rect x="58" y="24" width="124" height="143" rx="15" fill="#f7faf2" stroke="#315f42" stroke-width="7"/><rect x="98" y="14" width="44" height="22" rx="8" fill="#315f42"/><circle cx="120" cy="75" r="23" fill="#a8c8a0"/><path d="M81 127Q120 89 159 127" fill="#a8c8a0"/><path d="M79 145H161" stroke="#315f42" stroke-width="5"/><path d="M92 155H149" stroke="#315f42" stroke-width="4"/></svg>`
};

const demoPeople=[{cracha:'1001',nome:'Colaborador Exemplo',setor:'Recebimento',turno:'1º Turno'}];
let people=[...demoPeople], orders=[], menu={}, person=null, badge='', dateChoice='', meal='', flavor='', adminTab='pedidos', returnTimer=null;
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const addDays=(n)=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const fmt=(d)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(html,extra='')=>{app.innerHTML=`<section class="panel ${extra}">${html}</section>`};
function reset(){closeCamera();clearTimeout(returnTimer);person=null;badge='';dateChoice='';meal='';flavor=''}
function goHome(){reset();card(`<div class="hero center"><span class="pill">Bem-vindo ao nosso refeitório</span><h1>BOA<br><span>REFEIÇÃO!</span></h1><div class="food" aria-hidden="true">${art.prato}</div><p>Seu pedido de refeição, rápido e fácil.</p><button class="primary wide" onclick="badgeScreen()">🍴 FAZER PEDIDO →</button></div>`)}
function badgeScreen(){card(`<div class="center"><h2>IDENTIFIQUE-SE</h2><p class="hint">Aproxime seu crachá do leitor ou use a câmera do tablet.</p><div class="badge-art">${art.cracha}</div><button class="primary wide" onclick="openCamera()">📷 CLIQUE E APROXIME SEU CRACHÁ</button><div id="cameraArea" hidden><video id="cameraVideo" autoplay playsinline muted></video><p class="mini">Posicione o código de barras ou QR dentro da câmera.</p><button class="secondary" onclick="closeCamera()">Fechar câmera</button></div><div class="field"><label for="badge">Ou digite o número do crachá</label><input id="badge" inputmode="numeric" autocomplete="off" autofocus placeholder="Aguardando leitura..." onkeydown="if(event.key==='Enter')lookup()"></div><div class="actions"><button class="secondary" onclick="goHome()">Voltar</button><button class="primary" onclick="lookup()">Continuar →</button></div><p class="mini">Para testar, use o crachá fictício 1001. O leitor físico precisa funcionar como teclado (USB/Bluetooth) ou ter integração específica.</p></div>`);document.getElementById('badge').focus()}
function lookup(){closeCamera();badge=document.getElementById('badge').value.trim();if(!badge)return alert('Informe o número do crachá.');person=people.find(p=>p.cracha===badge);if(person)chooseDate();else registerScreen()}
function registerScreen(){card(`<h2>🪪 Crachá não encontrado</h2><p class="hint">Cadastre seus dados para continuar. Crachá: <b>${esc(badge)}</b></p><form onsubmit="register(event)"><div class="field"><label>Nome completo</label><input id="nm" required minlength="3" maxlength="100"></div><div class="row"><div class="field"><label>Setor</label><select id="sec" required><option value="">Selecione</option>${['Recebimento','Beneficiamento','Classificação','Armazém','Laboratório','Qualidade','Administrativo','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Turno</label><select id="shift" required><option value="">Selecione</option>${['1º Turno','2º Turno','3º Turno','Administrativo'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="actions"><button type="button" class="secondary" onclick="badgeScreen()">Voltar</button><button class="primary" type="submit">Cadastrar e continuar →</button></div></form><p class="mini">Cadastro somente de demonstração; será apagado ao atualizar a página.</p>`)}
function register(e){e.preventDefault();if(people.some(p=>p.cracha===badge))return alert('Este crachá já existe.');person={cracha:badge,nome:document.getElementById('nm').value.trim(),setor:document.getElementById('sec').value,turno:document.getElementById('shift').value};people.push(person);chooseDate()}
function selectDate(d){dateChoice=d;document.querySelectorAll('[data-date]').forEach(b=>b.classList.toggle('selected',b.dataset.date===d))}
function datesAvailable(){const d=new Date();const dow=d.getDay();if(dow===5)return [{value:addDays(1),label:'Sábado'},{value:addDays(3),label:'Segunda-feira'}];return [{value:addDays(1),label:'Próxima refeição'}]}
function chooseDate(){const dates=datesAvailable();dateChoice=dates[0].value;card(`<h2>Olá, ${esc(person.nome)}! 👋</h2><p class="hint">Para qual dia deseja fazer o pedido?</p><div class="options">${dates.map(x=>`<button class="opt ${x.value===dateChoice?'selected':''}" data-date="${x.value}" onclick="selectDate('${x.value}')">📅 ${esc(x.label)}<br><span class="mini">${esc(fmt(x.value))}</span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="goHome()">Cancelar</button><button class="primary" onclick="chooseMeal()">Continuar →</button></div>`)}
function chooseMeal(){meal='';card(`<h2>Olá, ${esc(person.nome)}! 👋</h2><p class="hint">Escolha uma opção para <b>${esc(fmt(dateChoice))}</b>.</p><div class="grid"><button class="choice" onclick="meal='OMELETE';chooseFlavor()"><div class="pic">${art.prato}</div><h3>Omelete</h3><p>Escolha o sabor</p></button><button class="choice" onclick="meal='ESPECIAL';confirmScreen()"><div class="pic">${art.especial}</div><h3>Especial do dia</h3><p>${esc(menu[dateChoice]||'Especial a definir pela Industrial')}</p></button></div><div class="actions"><button class="secondary" onclick="chooseDate()">← Voltar</button></div>`)}
function chooseFlavor(){card(`<h2>ESCOLHA SEU OMELETE</h2><p class="hint">Olá, ${esc(person.nome)}! Escolha um sabor.</p><div class="options">${['Simples','Queijo','Presunto e queijo','Presunto','Ovo cozido'].map(x=>`<button class="opt" onclick="flavor='${x}';confirmScreen()">🧀 ${x}</button>`).join('')}</div><button class="secondary" onclick="chooseMeal()">← Voltar</button>`)}
function confirmScreen(){const existing=orders.find(o=>o.cracha===person.cracha&&o.data===dateChoice);card(`<h2>CONFIRME SEU PEDIDO</h2><p class="hint">Olá, ${esc(person.nome)}!</p><div class="status"><p><b>Data:</b> ${esc(fmt(dateChoice))}</p><p><b>Refeição:</b> ${esc(meal==='OMELETE'?'Omelete — '+flavor:(menu[dateChoice]||'Especial do dia'))}</p></div>${existing?'<div class="status error">Já existe um pedido para esta data neste teste.</div>':''}<div class="actions"><button class="secondary" onclick="chooseMeal()">← Alterar</button><button class="primary" ${existing?'disabled':''} onclick="saveOrder()">✓ CONFIRMAR PEDIDO</button></div>`)}
function saveOrder(){if(orders.some(o=>o.cracha===person.cracha&&o.data===dateChoice))return confirmScreen();orders.push({cracha:person.cracha,nome:person.nome,setor:person.setor,turno:person.turno,data:dateChoice,tipo:meal,descricao:meal==='OMELETE'?flavor:(menu[dateChoice]||'Especial do dia'),entregue:false});card(`<div class="center"><div style="font-size:100px">✅</div><h2>PEDIDO CONFIRMADO!</h2><p class="hint">Obrigado, ${esc(person.nome)}!</p><p>Retornando ao início em <b id="countdown">5</b> segundos...</p></div>`);let left=5;function tick(){left--;if(left<=0){goHome();return}const el=document.getElementById('countdown');if(el)el.textContent=left;returnTimer=setTimeout(tick,1000)}returnTimer=setTimeout(tick,1000)}
let cameraStream=null,cameraTimer=null;
async function openCamera(){
 const area=document.getElementById('cameraArea');area.hidden=false;
 if(!navigator.mediaDevices?.getUserMedia){alert('Este navegador não oferece acesso à câmera. Digite o crachá ou use um leitor físico.');return}
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  const v=document.getElementById('cameraVideo');v.srcObject=cameraStream;await v.play();
  if(!('BarcodeDetector' in window)){alert('A câmera abriu, mas este navegador não tem leitura automática de códigos. Use um leitor físico ou digite o crachá.');return}
  const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','itf','codabar']});
  cameraTimer=setInterval(async()=>{if(!cameraStream||v.readyState<2)return;try{const codes=await detector.detect(v);if(codes.length){document.getElementById('badge').value=codes[0].rawValue;closeCamera();lookup()}}catch(e){}},400);
 }catch(e){area.hidden=true;alert('Não foi possível abrir a câmera. Autorize o acesso nas configurações do navegador ou digite o crachá.')}
}
function closeCamera(){if(cameraTimer)clearInterval(cameraTimer);cameraTimer=null;if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;const area=document.getElementById('cameraArea');if(area)area.hidden=true}
function openAdmin(){window.location.href="admin.html"}
goHome();
</script>
</body></html>

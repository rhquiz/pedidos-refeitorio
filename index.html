<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Refeitório VYLOR | Totem</title>
<style>
:root{--bg:#faf5e9;--cream:#fffdf7;--sage:#dfe9d2;--green:#315f42;--deep:#173c2d;--gold:#e5c77f;--text:#26372c;--muted:#657366;--line:#e4e5d8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef2e3,var(--bg) 35%,#f6f0dd);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}.shell{min-height:100dvh;max-width:1180px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;color:var(--deep);font-size:clamp(24px,4vw,38px);font-weight:900;letter-spacing:.05em}.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.19em}.leaf{font-size:36px}.top .right{display:flex;gap:10px}.subtle{background:#fff9;border:1px solid var(--line);color:var(--green);padding:12px 18px;border-radius:16px}.main{flex:1;display:grid;place-items:center;padding:22px 0}.panel{width:min(100%,940px);background:#fff9;border:1px solid #e5e9da;border-radius:32px;box-shadow:0 18px 50px #36553b12;padding:clamp(22px,4vw,50px)}.center{text-align:center}.hero h1{font-size:clamp(46px,9vw,90px);line-height:1.02;color:var(--deep);margin:10px 0}.hero h1 span{color:#648b55}.hero p{font-size:clamp(18px,2.4vw,25px);color:var(--muted)}.food{font-size:clamp(90px,15vw,175px);line-height:1.2;margin:12px 0 24px;filter:drop-shadow(0 12px 8px #294a2318)}.primary{background:var(--green);color:white;border:0;border-radius:22px;min-height:72px;padding:16px 30px;font-size:clamp(19px,2.6vw,28px);font-weight:800;box-shadow:0 9px 18px #315f4226}.primary:hover{background:var(--deep)}.wide{width:100%}.secondary{background:var(--sage);color:var(--deep);border:0;border-radius:18px;padding:17px 22px;font-weight:750;min-height:58px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.choice{background:var(--cream);border:3px solid var(--line);border-radius:24px;padding:22px;min-height:235px;text-align:center}.choice.selected{border-color:var(--green);background:#eef5e9}.choice .pic{font-size:clamp(65px,9vw,110px)}.choice h3{font-size:26px;margin:12px 0}.choice p{color:var(--muted)}h2{font-size:clamp(27px,4vw,42px);color:var(--deep);margin:0 0 14px}.hint{color:var(--muted);font-size:18px}.field{display:grid;gap:7px;margin:15px 0;text-align:left}.field label{font-weight:750}.field input,.field select{width:100%;padding:18px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:21px;color:var(--text)}.field input:focus,.field select:focus{outline:3px solid #b6d0ae}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.actions>*{flex:1}.status{padding:14px;border-radius:14px;background:#e9f1e5;margin:16px 0}.error{background:#fff0e6;color:#853b1c}.pill{display:inline-block;background:var(--sage);padding:9px 14px;border-radius:100px;color:var(--deep);font-weight:750}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.opt{padding:18px;border:2px solid var(--line);border-radius:16px;background:#fff;text-align:left;font-weight:700}.opt.selected{border-color:var(--green);background:#eaf3e4}.mini{font-size:14px;color:var(--muted)}.admin{width:min(100%,1100px)}.adminnav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.adminnav button{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.adminnav button.active{background:var(--green);color:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{background:var(--sage)}.notice{border-left:5px solid #b98429;padding:12px 16px;background:#fff4d7;margin:16px 0;border-radius:8px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:10px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{flex:1}@media(max-width:620px){.shell{padding:13px}.panel{border-radius:22px;padding:20px}.grid{grid-template-columns:1fr}.choice{min-height:165px}.choice .pic{font-size:66px}.options{grid-template-columns:1fr}.top .right button{font-size:12px;padding:9px}.actions{flex-direction:column}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="leaf">🌿</span><div>VYLOR<small>CULTIVANDO O FUTURO</small></div></div><div class="right"><button class="subtle" onclick="goHome()">⌂ Início</button><button class="subtle" onclick="openAdmin()">⚙ Administração</button></div></header><main class="main" id="app"></main><footer class="footer">Refeitório VYLOR · Protótipo de demonstração para tablet · Sem conexão ao banco de dados</footer></div>
<script>
'use strict';
// IMPORTANTE: demonstração local. NÃO grava nem consulta dados reais no Supabase.
// Antes da produção, implementar autenticação, RLS e funções seguras no servidor.
const app=document.getElementById('app');
const demoPeople=[{cracha:'1001',nome:'Colaborador Exemplo',setor:'Recebimento',turno:'1º Turno'}];
let people=[...demoPeople], orders=[], menu={}, person=null, badge='', dateChoice='', meal='', flavor='', adminTab='pedidos', returnTimer=null;
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const addDays=(n)=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const fmt=(d)=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(html,extra='')=>{app.innerHTML=`<section class="panel ${extra}">${html}</section>`};
function reset(){clearTimeout(returnTimer);person=null;badge='';dateChoice='';meal='';flavor=''}
function goHome(){reset();card(`<div class="hero center"><span class="pill">Bem-vindo ao nosso refeitório</span><h1>BOA<br><span>REFEIÇÃO!</span></h1><div class="food" aria-hidden="true">🍽️🥗</div><p>Seu pedido de refeição, rápido e fácil.</p><button class="primary wide" onclick="badgeScreen()">🍴 FAZER PEDIDO →</button></div>`)}
function badgeScreen(){card(`<div class="center"><h2>📇 Aproxime seu crachá</h2><p class="hint">Passe o crachá no leitor ou digite o número abaixo.</p><div style="font-size:100px;margin:20px">🪪</div><div class="field"><label for="badge">Número do crachá</label><input id="badge" inputmode="numeric" autocomplete="off" autofocus placeholder="Aguardando leitura..." onkeydown="if(event.key==='Enter')lookup()"></div><div class="actions"><button class="secondary" onclick="goHome()">Voltar</button><button class="primary" onclick="lookup()">Continuar →</button></div><p class="mini">Para testar, use o crachá fictício 1001. O leitor físico precisa funcionar como teclado (USB/Bluetooth) ou ter integração específica.</p></div>`);document.getElementById('badge').focus()}
function lookup(){badge=document.getElementById('badge').value.trim();if(!badge)return alert('Informe o número do crachá.');person=people.find(p=>p.cracha===badge);if(person)chooseDate();else registerScreen()}
function registerScreen(){card(`<h2>🪪 Crachá não encontrado</h2><p class="hint">Cadastre seus dados para continuar. Crachá: <b>${esc(badge)}</b></p><form onsubmit="register(event)"><div class="field"><label>Nome completo</label><input id="nm" required minlength="3" maxlength="100"></div><div class="row"><div class="field"><label>Setor</label><select id="sec" required><option value="">Selecione</option>${['Recebimento','Beneficiamento','Classificação','Armazém','Laboratório','Qualidade','Administrativo','Outro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Turno</label><select id="shift" required><option value="">Selecione</option>${['1º Turno','2º Turno','3º Turno','Administrativo'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="actions"><button type="button" class="secondary" onclick="badgeScreen()">Voltar</button><button class="primary" type="submit">Cadastrar e continuar →</button></div></form><p class="mini">Cadastro somente de demonstração; será apagado ao atualizar a página.</p>`)}
function register(e){e.preventDefault();if(people.some(p=>p.cracha===badge))return alert('Este crachá já existe.');person={cracha:badge,nome:document.getElementById('nm').value.trim(),setor:document.getElementById('sec').value,turno:document.getElementById('shift').value};people.push(person);chooseDate()}
function datesAvailable(){const d=new Date();const dow=d.getDay();if(dow===5)return [{value:addDays(1),label:'Sábado'},{value:addDays(3),label:'Segunda-feira'}];return [{value:addDays(1),label:'Próxima refeição'}]}
function chooseDate(){const dates=datesAvailable();dateChoice=dates[0].value;card(`<h2>Olá, ${esc(person.nome)}! 👋</h2><p class="hint">Para qual dia deseja fazer o pedido?</p><div class="options">${dates.map(x=>`<button class="opt ${x.value===dateChoice?'selected':''}" onclick="dateChoice='${x.value}';chooseDate()">📅 ${esc(x.label)}<br><span class="mini">${esc(fmt(x.value))}</span></button>`).join('')}</div><div class="actions"><button class="secondary" onclick="goHome()">Cancelar</button><button class="primary" onclick="chooseMeal()">Continuar →</button></div>`)}
function chooseMeal(){meal='';card(`<h2>Olá, ${esc(person.nome)}! 👋</h2><p class="hint">Escolha uma opção para <b>${esc(fmt(dateChoice))}</b>.</p><div class="grid"><button class="choice" onclick="meal='OMELETE';chooseFlavor()"><div class="pic">🍳</div><h3>Omelete</h3><p>Escolha o sabor</p></button><button class="choice" onclick="meal='ESPECIAL';confirmScreen()"><div class="pic">🍲</div><h3>Especial do dia</h3><p>${esc(menu[dateChoice]||'Especial a definir pela Industrial')}</p></button></div><div class="actions"><button class="secondary" onclick="chooseDate()">← Voltar</button></div>`)}
function chooseFlavor(){card(`<h2>🍳 Escolha seu omelete</h2><p class="hint">Olá, ${esc(person.nome)}! Escolha um sabor.</p><div class="options">${['Simples','Queijo','Presunto','Presunto e queijo'].map(x=>`<button class="opt" onclick="flavor='${x}';confirmScreen()">🧀 ${x}</button>`).join('')}</div><button class="secondary" onclick="chooseMeal()">← Voltar</button>`)}
function confirmScreen(){const existing=orders.find(o=>o.cracha===person.cracha&&o.data===dateChoice);card(`<h2>Confira seu pedido</h2><p class="hint">Olá, ${esc(person.nome)}!</p><div class="status"><p><b>Data:</b> ${esc(fmt(dateChoice))}</p><p><b>Refeição:</b> ${esc(meal==='OMELETE'?'Omelete — '+flavor:(menu[dateChoice]||'Especial do dia'))}</p></div>${existing?'<div class="status error">Já existe um pedido para esta data neste teste.</div>':''}<div class="actions"><button class="secondary" onclick="chooseMeal()">← Alterar</button><button class="primary" ${existing?'disabled':''} onclick="saveOrder()">✓ CONFIRMAR PEDIDO</button></div>`)}
function saveOrder(){if(orders.some(o=>o.cracha===person.cracha&&o.data===dateChoice))return confirmScreen();orders.push({cracha:person.cracha,nome:person.nome,setor:person.setor,turno:person.turno,data:dateChoice,tipo:meal,descricao:meal==='OMELETE'?flavor:(menu[dateChoice]||'Especial do dia'),entregue:false});card(`<div class="center"><div style="font-size:100px">✅</div><h2>Pedido realizado com sucesso!</h2><p class="hint">Obrigado, ${esc(person.nome)}!</p><p>Retornando ao início em <b id="countdown">5</b> segundos...</p></div>`);let left=5;function tick(){left--;if(left<=0){goHome();return}const el=document.getElementById('countdown');if(el)el.textContent=left;returnTimer=setTimeout(tick,1000)}returnTimer=setTimeout(tick,1000)}
function openAdmin(){reset();adminTab='pedidos';renderAdmin()}
function renderAdmin(){card(`<div class="notice"><b>PAINEL DE DEMONSTRAÇÃO.</b> Sem autenticação e sem persistência. Não use dados reais aqui nem publique esta área como painel operacional. A versão final exigirá login e permissões no Supabase.</div><h2>⚙ Painel da Industrial</h2><div class="adminnav">${[['pedidos','Pedidos'],['colaboradores','Colaboradores'],['cardapios','Especiais'],['relatorios','Relatórios']].map(([k,v])=>`<button class="${adminTab===k?'active':''}" onclick="adminTab='${k}';renderAdmin()">${v}</button>`).join('')}</div><div id="adminBody"></div>`, 'admin');if(adminTab==='pedidos'||adminTab==='relatorios')renderOrders();if(adminTab==='colaboradores')renderPeople();if(adminTab==='cardapios')renderMenu()}
function renderOrders(){document.getElementById('adminBody').innerHTML=`<div class="row"><div class="field"><label>Data da refeição</label><input type="date" id="filterDate" value="${today()}" onchange="fillOrders()"></div><div class="field"><label>Turno</label><select id="filterShift" onchange="fillOrders()"><option value="">Todos</option>${['1º Turno','2º Turno','3º Turno','Administrativo'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="actions"><button class="secondary" onclick="document.getElementById('filterDate').value='';document.getElementById('filterShift').value='';fillOrders()">Limpar filtros</button><button class="secondary" onclick="window.print()">🖨 Imprimir lista</button></div><div id="ordersTable"></div>`;fillOrders()}
function fillOrders(){const d=document.getElementById('filterDate').value,t=document.getElementById('filterShift').value;const filtered=orders.filter(o=>(!d||o.data===d)&&(!t||o.turno===t));document.getElementById('ordersTable').innerHTML=`<p><b>${filtered.length}</b> pedidos encontrados</p><div class="tablewrap"><table><thead><tr><th>Retirou?</th><th>Nome</th><th>Crachá</th><th>Turno</th><th>Data</th><th>Pedido</th></tr></thead><tbody>${filtered.map(o=>`<tr><td><input type="checkbox" ${o.entregue?'checked':''} onchange="toggleDelivery('${esc(o.cracha)}','${o.data}',this.checked)"></td><td>${esc(o.nome)}</td><td>${esc(o.cracha)}</td><td>${esc(o.turno)}</td><td>${esc(o.data)}</td><td>${esc(o.tipo+' — '+o.descricao)}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum pedido nesta demonstração.</td></tr>'}</tbody></table></div>`}
function toggleDelivery(c,d,v){const o=orders.find(x=>x.cracha===c&&x.data===d);if(o)o.entregue=v}
function renderPeople(){document.getElementById('adminBody').innerHTML=`<p class="hint">Cadastre individualmente ou importe um CSV com as colunas: cracha,nome,setor,turno</p><div class="field"><label>Importar CSV (exportado do Excel)</label><input type="file" id="csvFile" accept=".csv,text/csv" onchange="importCSV(event)"></div><form onsubmit="addPerson(event)"><div class="row"><div class="field"><label>Crachá</label><input id="newBadge" required></div><div class="field"><label>Nome</label><input id="newName" required></div></div><div class="row"><div class="field"><label>Setor</label><input id="newSector" required></div><div class="field"><label>Turno</label><input id="newShift" required></div></div><button class="primary" type="submit">+ Cadastrar</button></form><p><b>${people.length}</b> colaboradores nesta sessão</p><div class="tablewrap"><table><thead><tr><th>Crachá</th><th>Nome</th><th>Setor</th><th>Turno</th></tr></thead><tbody>${people.map(p=>`<tr><td>${esc(p.cracha)}</td><td>${esc(p.nome)}</td><td>${esc(p.setor)}</td><td>${esc(p.turno)}</td></tr>`).join('')}</tbody></table></div>`}
function addPerson(e){e.preventDefault();const p={cracha:document.getElementById('newBadge').value.trim(),nome:document.getElementById('newName').value.trim(),setor:document.getElementById('newSector').value.trim(),turno:document.getElementById('newShift').value.trim()};if(people.some(x=>x.cracha===p.cracha))return alert('Crachá já cadastrado');people.push(p);renderPeople()}
function importCSV(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').trim().split(/\r?\n/);const sep=lines[0].includes(';')?';':',';const headers=lines.shift().split(sep).map(x=>x.trim().toLowerCase());const idx=['cracha','nome','setor','turno'].map(x=>headers.indexOf(x));if(idx.includes(-1))return alert('Cabeçalhos obrigatórios: cracha,nome,setor,turno');let count=0;for(const line of lines){const v=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const p={cracha:v[idx[0]],nome:v[idx[1]],setor:v[idx[2]],turno:v[idx[3]]};if(Object.values(p).every(Boolean)&&!people.some(x=>x.cracha===p.cracha)){people.push(p);count++}}alert(`${count} registros importados nesta demonstração. Não foram salvos no Supabase.`);renderPeople()};reader.readAsText(f,'UTF-8')}
function renderMenu(){document.getElementById('adminBody').innerHTML=`<h3>Especial por data</h3><p class="hint">O mesmo especial vale para a opção e para a ceia.</p><form onsubmit="saveMenu(event)"><div class="field"><label>Data</label><input type="date" id="menuDate" required value="${addDays(1)}"></div><div class="field"><label>Nome do especial</label><input id="menuName" required placeholder="Ex.: Macarronoff"></div><button class="primary" type="submit">Salvar especial</button></form><div class="tablewrap"><table><thead><tr><th>Data</th><th>Especial</th></tr></thead><tbody>${Object.entries(menu).map(([d,v])=>`<tr><td>${esc(d)}</td><td>${esc(v)}</td></tr>`).join('')||'<tr><td colspan="2">Nenhum especial cadastrado nesta sessão.</td></tr>'}</tbody></table></div>`}
function saveMenu(e){e.preventDefault();menu[document.getElementById('menuDate').value]=document.getElementById('menuName').value.trim();renderMenu()}
goHome();
</script>
</body></html>

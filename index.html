<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Refeitório VYLOR</title>
<style>
:root{--green:#24583f;--dark:#143d30;--mint:#dfeadd;--beige:#f7f1e4;--wine:#873f4a;--ink:#304038;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#e5efdd,transparent 40%),radial-gradient(circle at 100% 100%,#e8e9cc,transparent 40%),var(--beige);font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:wait}.shell{min-height:100dvh;max-width:1380px;margin:auto;padding:20px 32px;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between}.logo{font-size:clamp(23px,3vw,34px);font-weight:900;letter-spacing:.11em;color:var(--dark)}.logo small{display:block;font-size:10px;letter-spacing:.23em;font-weight:600}.leaf{color:#6c9764}.back{border:1px solid #c7d6bf;background:#fff9;border-radius:20px;color:var(--green);padding:12px 22px;font-weight:800}.main{flex:1;display:grid;place-items:center;padding:12px 0}.panel{width:min(100%,1110px);padding:clamp(22px,4vw,50px);background:#fffcf5df;border:1px solid #e2e5d7;border-radius:38px;box-shadow:0 20px 70px #32523b12;animation:enter .4s ease both}.center{text-align:center}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(55px,8vw,98px);line-height:.98;color:var(--wine);letter-spacing:-.055em;margin-bottom:12px}h2{font-size:clamp(30px,4vw,52px);color:var(--wine);line-height:1.08;margin-bottom:16px}h3{font-size:clamp(18px,2.2vw,27px)}.hint{color:#67766a;font-size:clamp(16px,1.9vw,22px)}.tag{display:inline-block;background:#e7f0df;color:var(--green);font-weight:800;border-radius:100px;padding:9px 18px;margin-bottom:18px}.btn{border:0;border-radius:22px;padding:18px 28px;min-height:65px;font-weight:850;font-size:clamp(17px,2vw,23px);transition:transform .2s,box-shadow .2s}.btn:hover,.meal:hover,.flavor:hover{transform:translateY(-3px);box-shadow:0 15px 24px #315b4220}.btn:active,.meal:active,.flavor:active{transform:scale(.98)}.primary{background:var(--green);color:white;box-shadow:0 9px 20px #24583f24}.secondary{background:#e5eddf;color:var(--dark)}.outline{border:2px solid #b5c8b2;background:transparent;color:var(--dark)}.wide{width:min(100%,480px)}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:25px}.actions .btn{min-width:200px}.illustration{width:min(100%,380px);height:245px;display:block;margin:0 auto 16px;filter:drop-shadow(0 15px 9px #294d3018);animation:float 4s ease-in-out infinite}.illustration.small{height:155px;width:210px}.illustration.big{height:280px}.mealgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;margin:28px auto;max-width:900px}.meal,.flavor{border:3px solid #d9e3d1;background:#fffef8;border-radius:30px;min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}.meal{padding:25px;min-height:345px}.meal h3{font-size:clamp(24px,3vw,35px);margin-bottom:5px;color:var(--dark)}.meal p{color:#6c796b}.roundarrow{width:50px;height:50px;display:grid;place-items:center;background:var(--green);color:white;border-radius:50%;font-size:30px;margin:14px auto 0}.flavors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:30px 0}.flavor{padding:14px 7px;min-height:220px;font-weight:850;font-size:clamp(14px,1.5vw,20px);color:var(--dark)}.flavor .illustration{height:105px;width:100%;margin:0 auto 14px}.field{display:grid;gap:8px;text-align:left;margin:15px auto;max-width:700px}.field label{font-weight:800;color:var(--dark)}.field input,.field select{width:100%;padding:16px 19px;border-radius:17px;border:2px solid #cbd8c5;background:#fff;font-size:21px;color:var(--ink)}.field input:focus,.field select:focus{outline:3px solid #a7c8a0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-width:700px;margin:auto}.fields .field:first-child{grid-column:1/-1}.dategrid{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:30px 0}.datechoice{padding:24px;border:3px solid #d1dfcd;background:#fff;border-radius:25px;min-width:230px;font-size:22px;color:var(--dark);font-weight:800}.datechoice.selected{background:#e5f1df;border-color:var(--green)}.summary{background:#eaf2e4;border:1px solid #c8d9c3;border-radius:26px;padding:25px;max-width:700px;margin:25px auto;text-align:left;font-size:21px}.summary p{margin:12px 0}.error{background:#fff0e9;border-left:5px solid #ae5547;border-radius:14px;padding:14px;color:#863e32;max-width:700px;margin:15px auto}.notice{font-size:13px;color:#647264;margin:14px auto;max-width:750px}.scanner{position:relative;max-width:600px;margin:16px auto;border-radius:25px;overflow:hidden;background:#1c2d24}.scanner video{display:block;width:100%;max-height:320px;object-fit:cover}.scanbox{position:absolute;inset:15% 13%;border:4px solid #a8f3ac;border-radius:18px;pointer-events:none;box-shadow:0 0 0 200px #0003}.scanbox:after{content:'';position:absolute;top:50%;left:4%;right:4%;height:2px;background:#f5ffdb;box-shadow:0 0 14px #d9ffbd;animation:scan 2s ease-in-out infinite}.footer{text-align:center;color:#829081;font-size:12px;padding:12px}.heart{animation:beat 1.3s ease infinite}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes beat{50%{transform:scale(1.06)}}@keyframes scan{0%,100%{top:15%}50%{top:80%}}@media(max-width:780px){.shell{padding:14px}.panel{border-radius:26px}.flavors{grid-template-columns:repeat(3,1fr)}.meal{min-height:280px}.illustration.big{height:215px}.actions .btn{min-width:160px}}@media(max-width:520px){.mealgrid,.fields{grid-template-columns:1fr}.flavors{grid-template-columns:repeat(2,1fr)}.meal{min-height:230px}.illustration{height:190px}.logo{font-size:22px}.btn{width:100%}}

/* Destaque discreto do prato: texto vinho e marca-texto cinza claro */
.special-dish{display:block;width:min(100%,850px);margin:16px auto 12px;padding:16px 25px;border-radius:35px;background:#e8e8e3;color:#873f4a;font-size:clamp(26px,3.4vw,40px);font-weight:900;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.special-art .illustration{height:clamp(145px,19vw,205px);width:auto;max-width:100%}
.datechoice.selected{border-color:#24583f;background:#e2efdc;box-shadow:inset 0 0 0 2px #24583f}
</style></head><body><div class="shell"><header class="header"><div class="logo"><span class="leaf">✦</span> VYLOR<small>REFEITÓRIO • CULTIVANDO O FUTURO</small></div><button class="back" id="homeButton" onclick="home()">⌂ Início</button></header><main class="main" id="app"></main><footer class="footer">Refeitório VYLOR · Pedidos de refeições</footer></div>
<script>
'use strict';
// Chave publicável: segura para estar no navegador. Nunca insira service_role/secret aqui.
const SUPABASE_URL='https://qhggqfybvtqwfjqotwzk.supabase.co';
const SUPABASE_KEY='sb_publishable_9V3Xa93f59OCO0IMFOw5mw_vAm0OmEX';
const app=document.getElementById('app');let person=null,badge='',dateChoice='',meal='',flavor='',special='',timer=null,stream=null,scannerTimer=null,scannerBusy=false,scanDetector=null,scanFallback=null,keyboardBuffer='',keyboardLast=0,processing=false,selectedDates=[],pendingDates=[];
// Horário de Brasília: 06:00-13:59 = 1º; 14:00-21:59 = 2º; 22:00-05:59 = 3º.
function turnoAutomatico(){
 const hora=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
 return hora>=6&&hora<14?'1º Turno':hora>=14&&hora<22?'2º Turno':'3º Turno';
}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art=(kind='meal',label='')=>{const base=`<ellipse cx="160" cy="166" rx="120" ry="22" fill="#b8cbb0" opacity=".35"/><ellipse cx="160" cy="150" rx="123" ry="55" fill="#e4ede0"/><ellipse cx="160" cy="139" rx="108" ry="49" fill="#fffefa" stroke="#a9c6a7" stroke-width="8"/>`;let dish='';if(kind==='badge')return `<svg class="illustration" viewBox="0 0 320 210" aria-hidden="true"><rect x="91" y="19" width="138" height="170" rx="23" fill="#fffdf5" stroke="#356e50" stroke-width="8"/><rect x="139" y="7" width="44" height="28" rx="10" fill="#356e50"/><circle cx="160" cy="85" r="30" fill="#9ec5a0"/><path d="M112 144q48-59 96 0" fill="#9ec5a0"/><g fill="#356e50">${Array.from({length:15},(_,i)=>`<rect x="${109+i*7}" y="159" width="${i%3===0?4:2}" height="18"/>`).join('')}</g></svg>`;
if(kind==='silvercloche')return `<svg class="illustration" viewBox="0 0 320 210" role="img" aria-label="Cloche prateada de servir refeições"><defs><linearGradient id="silver" x1="0" y1="0" x2="1" y2="0.8"><stop offset="0" stop-color="#8c8e87"/><stop offset=".18" stop-color="#fdfcf5"/><stop offset=".43" stop-color="#b5b7b0"/><stop offset=".68" stop-color="#ecebe5"/><stop offset="1" stop-color="#8c8d86"/></linearGradient><linearGradient id="rim" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fffefa"/><stop offset=".5" stop-color="#b5b5ad"/><stop offset="1" stop-color="#f7f5ed"/></linearGradient></defs><ellipse cx="160" cy="185" rx="122" ry="13" fill="#b9c4b0" opacity=".25"/><ellipse cx="160" cy="169" rx="124" ry="18" fill="url(#rim)" stroke="#b9b9b1" stroke-width="3"/><path d="M53 157C57 92 96 53 160 53s103 39 107 104Z" fill="url(#silver)" stroke="#999b93" stroke-width="3"/><path d="M83 138c12-38 35-58 57-66" fill="none" stroke="#fffdf5" stroke-width="12" opacity=".7" stroke-linecap="round"/><rect x="151" y="42" width="18" height="15" rx="5" fill="url(#silver)"/><ellipse cx="160" cy="37" rx="18" ry="12" fill="url(#silver)" stroke="#9d9d96" stroke-width="2"/><path d="M42 161h236" stroke="#92948c" stroke-width="6" stroke-linecap="round"/><path d="M52 165h216" stroke="#f9f9f1" stroke-width="5" stroke-linecap="round"/><g stroke="#9ab58a" stroke-width="7" stroke-linecap="round"><path d="M49 81l-13-18"/><path d="M271 81l13-18"/></g></svg>`;
if(kind==='cloche'||kind==='success')return `<svg class="illustration ${kind==='success'?'big heart':''}" viewBox="0 0 320 210" aria-hidden="true"><ellipse cx="160" cy="181" rx="121" ry="15" fill="#b6c9b0" opacity=".5"/><path d="M48 159q5-111 112-111t112 111Z" fill="#78a781" stroke="#285b41" stroke-width="9"/><path d="M90 123q16-44 45-47" stroke="#cde7c5" stroke-width="12" fill="none" stroke-linecap="round"/><circle cx="160" cy="41" r="13" fill="#d6b86d"/><path d="M37 167h246" stroke="#285b41" stroke-width="15" stroke-linecap="round"/>${kind==='success'?'<path d="M160 104c-25-29-56 5 0 40 56-35 25-69 0-40" fill="#fff4dd"/>':''}</svg>`;
if(kind==='egg')dish='<ellipse cx="160" cy="139" rx="64" ry="31" fill="#fff7df" stroke="#ebdfbd" stroke-width="3"/><circle cx="160" cy="136" r="19" fill="#f5b73b"/>';
else{dish='<path d="M84 145q15-73 95-68 61 4 64 65-61 48-159 3" fill="#e5b758" stroke="#c98b38" stroke-width="5"/><path d="M102 128q55-39 110 1" fill="none" stroke="#fbe49a" stroke-width="14" stroke-linecap="round"/>';if(kind==='cheese'||kind==='hamcheese')dish+='<path d="M130 118l17 6 12-10 19 10" fill="none" stroke="#fff2bb" stroke-width="11" stroke-linecap="round"/>';if(kind==='ham'||kind==='hamcheese')dish+='<g fill="#cd857a"><rect x="111" y="124" width="17" height="9" rx="4"/><rect x="176" y="129" width="19" height="9" rx="4"/></g>';dish+='<g fill="#518b52"><ellipse cx="112" cy="148" rx="8" ry="4"/><ellipse cx="199" cy="143" rx="8" ry="4"/><ellipse cx="154" cy="154" rx="7" ry="3"/></g>'}return `<svg class="illustration" viewBox="0 0 320 210" aria-label="${esc(label)}" role="img">${base}${dish}<path d="M65 172q25 14 45 0" stroke="#7fa37a" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`};
const show=(html,center=true)=>{app.innerHTML=`<section class="panel ${center?'center':''}">${html}</section>`};const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const plusDays=n=>{const d=new Date(today()+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const format=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
async function rpc(name,args){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`},body:JSON.stringify(args)});const t=await r.text();let data;try{data=t?JSON.parse(t):null}catch{data=t}if(!r.ok)throw new Error(typeof data==='object'?(data.message||data.error||'Falha de comunicação'):String(data));return data}
function err(e){console.error(e);alert('Não foi possível concluir: '+(e.message||'erro desconhecido')+'. Confira a conexão e a configuração do Supabase.')}function clearState(){clearTimeout(timer);stopCamera();person=null;badge='';dateChoice='';meal='';flavor='';special='';processing=false;selectedDates=[];pendingDates=[]}function home(){clearState();show(`<span class="tag">BEM-VINDO AO NOSSO REFEITÓRIO</span><h1>BOA<br>REFEIÇÃO!</h1>${art('silvercloche','Cloche prateada')}<p class="hint">Uma refeição especial começa com uma escolha.</p><button class="btn primary wide" onclick="badgeScreen()">FAZER MEU PEDIDO &nbsp; ➜</button>`)}
function badgeScreen(){stopCamera();show(`<h2>IDENTIFIQUE-SE</h2><p class="hint">Aproxime seu crachá para começar o pedido.</p>${art('badge')}<button class="btn primary wide" onclick="startCamera()">▣ &nbsp; CLIQUE E APROXIME SEU CRACHÁ</button><div id="cameraWrap" class="hidden"><div class="scanner"><video id="camera" autoplay playsinline muted></video><div class="scanbox"></div></div><p id="cameraHint" class="hint">Centralize o código de barras ou QR Code no retângulo.</p><button class="btn secondary" onclick="stopCamera()">Fechar câmera</button></div><div class="field"><label for="badgeInput">Ou digite o número do crachá</label><input id="badgeInput" autocomplete="off" inputmode="numeric" placeholder="Número do crachá" onkeydown="if(event.key==='Enter')lookup()"></div><div class="actions"><button class="btn secondary" onclick="home()">VOLTAR</button><button class="btn primary" onclick="lookup()">CONTINUAR ➜</button></div><p class="notice">Leitor USB/Bluetooth: posicione o cursor no campo do crachá e aproxime o cartão.</p>`);document.getElementById('badgeInput').focus()}
async function lookup(raw){if(processing)return;const code=String(raw??document.getElementById('badgeInput')?.value??'').trim();if(!code){alert('Informe ou leia o número do crachá.');return}processing=true;stopCamera();badge=code;show('<h2>CONSULTANDO CRACHÁ...</h2><p class="hint">Só um instante.</p>');try{const p=await rpc('totem_buscar_colaborador',{p_cracha:badge});if(p&&p.ativo!==false){person=p;chooseDate()}else if(p&&p.ativo===false){show('<h2>ACESSO INDISPONÍVEL</h2><p class="hint">Seu cadastro está inativo. Procure a equipe responsável.</p><button class="btn primary" onclick="home()">VOLTAR</button>')}else registerScreen()}catch(e){err(e);badgeScreen()}finally{processing=false}}
function registerScreen(){show(`<h2>PRIMEIRO ACESSO</h2><p class="hint">Não encontramos o crachá <strong>${esc(badge)}</strong>. Faça seu cadastro uma única vez.</p>${art('badge')}<form id="regForm" onsubmit="register(event)"><div class="fields"><div class="field"><label for="nm">Nome completo</label><input id="nm" maxlength="100" minlength="3" required autocomplete="off"></div><div class="field"><label for="sector">Setor</label><select id="sector" required><option value="">Selecione</option>${['Recebimento','Beneficiamento','Classificação','Debulha','Secador','Torre / Ensaque','Tratamento Adicional','Armazém','Controle de Qualidade','Laboratório','Planejamento','Administrativo','Outro'].map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="shift">Turno automático (horário do pedido)</label><input id="shift" readonly value="${esc(turnoAutomatico())}"></div></div><div class="actions"><button type="button" class="btn secondary" onclick="badgeScreen()">VOLTAR</button><button id="regBtn" class="btn primary" type="submit">SALVAR CADASTRO ➜</button></div></form><p class="notice">Os dados são enviados ao banco de dados. Não é necessário cadastrar novamente nos próximos acessos.</p>`)}
async function register(e){e.preventDefault();if(processing)return;const nome=document.getElementById('nm').value.trim(),setor=document.getElementById('sector').value,turno=turnoAutomatico();if(nome.length<3)return alert('Informe o nome completo.');processing=true;document.getElementById('regBtn').disabled=true;try{const p=await rpc('totem_cadastrar_colaborador',{p_cracha:badge,p_nome:nome,p_setor:setor,p_turno:turno});person=p;chooseDate()}catch(e){err(e);document.getElementById('regBtn').disabled=false}finally{processing=false}}
function dates(){const day=new Date().getDay();if(day===5)return [{d:plusDays(1),title:'SÁBADO'},{d:plusDays(3),title:'SEGUNDA-FEIRA'}];if(day===6||day===0)return [];return [{d:plusDays(1),title:'AMANHÃ'}]}
function chooseDate(){const list=dates();pendingDates=[];selectedDates=list.length?[list[0].d]:[];dateChoice=selectedDates[0]||'';if(!list.length){show('<h2>PEDIDOS INDISPONÍVEIS</h2><p class="hint">Novos pedidos são feitos de segunda a sexta-feira.</p><button class="btn primary" onclick="home()">VOLTAR AO INÍCIO</button>');return}const friday=list.length===2;show(`<span class="tag">OLÁ, ${esc(person.nome.split(' ')[0].toUpperCase())}!</span><h2>PARA QUAL DIA?</h2><p class="hint">${friday?'Na sexta-feira, escolha sábado, segunda-feira ou os dois dias. Cada dia terá uma refeição própria.':'Selecione a data da sua refeição.'}</p><div class="dategrid">${list.map(x=>`<button type="button" class="datechoice ${selectedDates.includes(x.d)?'selected':''}" data-date="${x.d}" onclick="selectDate('${x.d}')">${x.title}<br><small>${esc(format(x.d))}</small></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="home()">CANCELAR</button><button class="btn primary" onclick="beginOrders()">CONTINUAR ➜</button></div>`)}
function selectDate(d){if(dates().length===2){selectedDates=selectedDates.includes(d)?selectedDates.filter(x=>x!==d):[...selectedDates,d]}else{selectedDates=[d]}document.querySelectorAll('.datechoice').forEach(x=>x.classList.toggle('selected',selectedDates.includes(x.dataset.date)))}
function beginOrders(){if(!selectedDates.length){alert('Selecione pelo menos um dia.');return}const ordered=dates().map(x=>x.d).filter(x=>selectedDates.includes(x));dateChoice=ordered.shift();pendingDates=ordered;chooseMeal()}
async function chooseMeal(){show('<h2>CARREGANDO CARDÁPIO...</h2>');try{const m=await rpc('totem_especial_do_dia',{p_data:dateChoice});special=m?.especial||'';show(`<span class="tag">${esc(format(dateChoice).toUpperCase())}</span><h2>O QUE VOCÊ DESEJA?</h2><p class="hint">Escolha uma das opções para sua refeição.</p><div class="mealgrid"><button class="meal" onclick="meal='OMELETE';chooseFlavor()">${art('meal','Omelete')}<h3>OMELETE</h3><p>Escolha seu sabor favorito</p><span class="roundarrow">➜</span></button><button class="meal" onclick="meal='ESPECIAL';showSpecial()">${art('cloche')}<h3>ESPECIAL</h3><p>${esc(special||'Confira o especial do dia')}</p><span class="roundarrow">➜</span></button></div><button class="btn secondary" onclick="chooseDate()">← VOLTAR</button>`)}catch(e){err(e);chooseDate()}}
const flavors=[['Simples','meal'],['Queijo','cheese'],['Presunto e queijo','hamcheese'],['Presunto','ham'],['Ovo cozido','egg']];function chooseFlavor(){show(`<span class="tag">${esc(format(dateChoice).toUpperCase())}</span><h2>ESCOLHA SEU OMELETE</h2><p class="hint">Toque na opção desejada.</p><div class="flavors">${flavors.map(([name,kind],i)=>`<button class="flavor" onclick="flavor=flavors[${i}][0];confirmScreen()">${art(kind,name)}${esc(name.toUpperCase())}<span class="roundarrow">➜</span></button>`).join('')}</div><button class="btn secondary" onclick="chooseMeal()">← VOLTAR</button>`)}function showSpecial(){show(`<span class="tag">${esc(format(dateChoice).toUpperCase())}</span><h2>ESPECIAL ${dates().length===2?'PARA '+(dateChoice===plusDays(1)?'SÁBADO':'SEGUNDA-FEIRA'):'DE AMANHÃ'}</h2><div class="special-art">${art('cloche')}</div><div class="special-dish">${esc(special||'Especial do dia')}</div><p class="hint">${special?'Preparado especialmente para você.':'O cardápio ainda não foi cadastrado pela Industrial.'}</p><div class="actions"><button class="btn secondary" onclick="chooseMeal()">VOLTAR</button><button class="btn primary" onclick="confirmScreen()">CONTINUAR ➜</button></div>`)}function confirmScreen(){show(`<h2>CONFIRME SEU PEDIDO</h2>${art(meal==='ESPECIAL'?'cloche':(flavors.find(x=>x[0]===flavor)?.[1]||'meal'))}<div class="summary"><p><strong>Colaborador:</strong> ${esc(person.nome)}</p><p><strong>Data:</strong> ${esc(format(dateChoice))}</p><p><strong>Turno do pedido:</strong> ${esc(turnoAutomatico())}</p><p><strong>Refeição:</strong> ${esc(meal==='ESPECIAL'?(special||'Especial do dia'):(flavor==='Ovo cozido'?'Ovo cozido':'Omelete de '+flavor.toLowerCase()))}</p></div><div class="actions"><button class="btn secondary" onclick="chooseMeal()">ALTERAR</button><button id="saveBtn" class="btn primary" onclick="saveOrder()">CONFIRMAR PEDIDO ✓</button></div>`)}
async function saveOrder(){if(processing)return;processing=true;document.getElementById('saveBtn').disabled=true;try{const res=await rpc('totem_salvar_pedido',{p_cracha:badge,p_data:dateChoice,p_tipo:meal,p_sabor:meal==='OMELETE'?flavor:null});if(!res?.ok)throw new Error('Pedido não confirmado pelo servidor.');success()}catch(e){if(/já existe|ja existe|duplicad|unique/i.test(e.message||'')){show(`<h2>VOCÊ JÁ FEZ SEU PEDIDO</h2><p class="hint">Já existe um pedido para ${esc(format(dateChoice))}.</p><button class="btn primary" onclick="${pendingDates.length?'nextAfterDuplicate()':'home()'}">${pendingDates.length?'CONTINUAR PARA O PRÓXIMO DIA':'VOLTAR AO INÍCIO'}</button>`)}else{err(e);confirmScreen()}}finally{processing=false}}
function nextAfterDuplicate(){dateChoice=pendingDates.shift();meal='';flavor='';special='';chooseMeal()}
function success(){if(pendingDates.length){const done=dateChoice;dateChoice=pendingDates.shift();meal='';flavor='';special='';show(`<h2>PEDIDO CONFIRMADO!</h2>${art('success')}<p class="hint">Pedido para ${esc(format(done))} registrado!</p><div class="summary"><strong>Agora escolha a refeição para ${esc(format(dateChoice))}.</strong></div><button class="btn primary wide" onclick="chooseMeal()">FAZER O PRÓXIMO PEDIDO ➜</button><button class="btn secondary" onclick="home()" style="margin-top:12px">ENCERRAR</button>`);return}show(`<h2>PEDIDO CONFIRMADO!</h2>${art('success')}<h3>OBRIGADO!</h3><p class="hint">Sua refeição foi registrada com sucesso.</p><button class="btn primary wide" onclick="home()">NOVO PEDIDO ➜</button><p class="notice">Voltando ao início em <strong id="seconds">5</strong> segundos...</p>`);let n=5;timer=setInterval(()=>{n--;const el=document.getElementById('seconds');if(el)el.textContent=n;if(n<=0){clearInterval(timer);home()}},1000)}
// Leitor ZXing: usa a câmera traseira e lê códigos de barras lineares.
// Necessita HTTPS e acesso à biblioteca CDN no dispositivo.
let cameraSession=0;
function loadZXing(){
  if(window.ZXing?.BrowserMultiFormatReader)return Promise.resolve();
  if(window.zxingLoading)return window.zxingLoading;
  window.zxingLoading=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js';
    script.onload=()=>window.ZXing?.BrowserMultiFormatReader?resolve():reject(new Error('ZXing indisponível'));
    script.onerror=()=>reject(new Error('Não foi possível carregar a biblioteca ZXing. Confira a internet.'));
    document.head.appendChild(script);
  }).catch(e=>{window.zxingLoading=null;throw e});
  return window.zxingLoading;
}
async function startCamera(){
  stopCamera();
  const session=++cameraSession;
  const wrap=document.getElementById('cameraWrap');
  const hint=document.getElementById('cameraHint');
  if(!wrap||!hint)return;
  wrap.classList.remove('hidden');
  hint.textContent='Preparando câmera...';
  if(!navigator.mediaDevices?.getUserMedia){hint.textContent='Abra o site em HTTPS no Chrome ou Safari e autorize a câmera.';return}
  try{
    await loadZXing();
    if(session!==cameraSession)return;
    const formats=[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8];
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    scanFallback=new ZXing.BrowserMultiFormatReader(hints,250);
    hint.textContent='Posicione as listrinhas na horizontal, dentro da área. Afaste um pouco para focar.';
    await scanFallback.decodeFromConstraints(
      {audio:false,video:facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}}},
      'camera',
      (result,error)=>{
        if(session!==cameraSession||!result||processing)return;
        const code=String(result.getText()||'').trim();
        if(!code)return;
        stopCamera();
        if(navigator.vibrate)navigator.vibrate(80);
        lookup(code); // Mantém os zeros iniciais do crachá.
      }
    );
  }catch(e){
    if(session!==cameraSession)return;
    console.error('Erro de leitura de crachá:',e);
    hint.textContent='Não foi possível ler pela câmera. Verifique a permissão e tente novamente ou digite o crachá.';
    if(scanFallback){try{scanFallback.reset()}catch{}scanFallback=null}
  }
}
function stopCamera(){
  cameraSession++;
  if(scannerTimer){clearInterval(scannerTimer);scannerTimer=null}
  if(scanFallback){try{scanFallback.reset()}catch{}scanFallback=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const video=document.getElementById('camera');
  if(video?.srcObject){try{video.srcObject.getTracks().forEach(t=>t.stop())}catch{}video.srcObject=null}
  const wrap=document.getElementById('cameraWrap');
  if(wrap)wrap.classList.add('hidden');
  scanDetector=null;
}
window.addEventListener('beforeunload',stopCamera);home();
</script></body></html>
